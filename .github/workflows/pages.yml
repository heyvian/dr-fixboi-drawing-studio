name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/configure-pages@v5
        id: pages
      - name: Assemble static site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site/vendor/rhino3dm
          cp index.html site.webmanifest _site/
          cp -R src tools _site/
          cp node_modules/rhino3dm/{rhino3dm.module.min.js,rhino3dm.wasm} _site/vendor/rhino3dm/
          cp node_modules/rhino3dm/README.md _site/vendor/rhino3dm/
          node -e 'const fs = require("node:fs"); const file = "_site/index.html"; const base = process.env.PAGES_URL; if (base) fs.writeFileSync(file, fs.readFileSync(file, "utf8").replaceAll("https://heyvian.github.io/dr-fixboi-drawing-studio/", base.replace(/\/$/, "") + "/"));'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
