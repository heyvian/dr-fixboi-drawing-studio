name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/vendor/rhino3dm
          cp index.html _site/
          cp -R src tools _site/
          cp node_modules/rhino3dm/{rhino3dm.module.min.js,rhino3dm.wasm} _site/vendor/rhino3dm/
          cp node_modules/rhino3dm/README.md _site/vendor/rhino3dm/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
